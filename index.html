<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라벨 출력 · 부착 작업 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#16191C;
    --panel:#1F2429;
    --edge:#2E353C;
    --paper:#FDFDFB;
    --ink:#14171A;
    --muted:#8D959E;
    --yellow:#FFC400;
    --scan:#E4392F;
    --ok:#22A96B;
    --kraft:#C79358;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:20px 14px 28px;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .wrap{max-width:520px;width:100%;margin:0 auto}

  /* ── header ── */
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    color:var(--yellow);text-transform:uppercase;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--edge)}
  h1{
    font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.03em;margin:0 0 8px;
  }
  .flow{
    font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:-.01em;margin:0 0 18px;
  }
  .flow b{color:var(--paper);font-weight:500}

  /* ── player ── */
  .player{border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--panel)}
  .stage{position:relative;background:#101315;aspect-ratio:5/4}
  .scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease}
  .scene.on{opacity:1;visibility:visible}
  .scene svg{width:100%;height:100%;display:block}

  .tag{
    position:absolute;top:12px;left:12px;z-index:2;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    background:var(--yellow);color:#14171A;font-weight:700;
    padding:4px 8px;border-radius:3px;
  }
  .tag.alt{background:var(--scan);color:#FDFDFB}

  .cap{padding:16px 16px 18px;border-top:1px solid var(--edge)}
  .cap h2{margin:0 0 6px;font-size:18px;font-weight:800;letter-spacing:-.02em}
  .cap p{margin:0;font-size:14px;line-height:1.6;color:#C3C9D0}
  .cap p em{font-style:normal;color:var(--yellow);font-weight:700}

  /* ── hazard tape progress ── */
  .track{height:12px;background:#0D0F11;overflow:hidden}
  #fill{
    height:100%;width:0;
    background:repeating-linear-gradient(45deg,var(--yellow) 0 9px,#14171A 9px 18px);
  }
  .playing #fill{animation-play-state:running}
  @keyframes run{from{width:0}to{width:100%}}

  /* ── controls ── */
  .ctrl{display:flex;align-items:center;gap:8px;padding:12px;background:var(--panel)}
  button{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    background:transparent;color:var(--paper);
    border:1px solid var(--edge);border-radius:6px;
    padding:9px 12px;cursor:pointer;transition:.15s;
  }
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  #play{background:var(--yellow);color:#14171A;border-color:var(--yellow);font-weight:700;min-width:82px}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{
    font-family:var(--mono);font-size:10px;color:var(--muted);
    width:26px;height:26px;border:1px solid var(--edge);border-radius:5px;
    display:grid;place-items:center;cursor:pointer;background:transparent;padding:0;
  }
  .dot[aria-current="true"]{background:var(--paper);color:#14171A;border-color:var(--paper);font-weight:700}

  @media (prefers-reduced-motion: reduce){
    #fill,.scene,[data-anim]{animation:none !important;transition:none !important}
  }
  @media (max-width:380px){ h1{font-size:23px} }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">출고 작업 표준 · 4 STEP + 예외 2</div>

    <div class="stage" id="stage">

            <g data-bar data-x="232" data-y="220" data-w="18" data-h="40" data-dir="v" data-seed="15" fill="#14171A"></g>
          </g>
          <text x="200" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#FFC400">라벨 붙이지 말고 바닥에 내려놓는다</text>
        </svg>
      </div>

      <!-- ══ 예외 B : GL번호 불일치 ══ -->
      <div class="scene" id="s5">
        <div class="tag alt">예외 B</div>
        <svg viewBox="0 0 400 320" role="img" aria-label="GL번호가 다를 때의 조치 그림">
          <!-- two mismatched labels -->
          <rect x="30" y="34" width="148" height="86" rx="6" fill="#FDFDFB" stroke="#D8D3C7" stroke-width="1.5"/>
          <text x="104" y="58" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#8D959E">화물 용지</text>
          <rect x="42" y="68" width="124" height="22" rx="3" fill="#FFE9A8"/>
          <text x="104" y="83.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#14171A">GL2601010001<tspan fill="#E4392F">23</tspan></text>

          <rect x="222" y="34" width="148" height="86" rx="6" fill="#FDFDFB" stroke="#D8D3C7" stroke-width="1.5"/>
          <text x="296" y="58" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#8D959E">출력된 라벨</text>
          <rect x="234" y="68" width="124" height="22" rx="3" fill="#FFE9A8"/>
          <text x="296" y="83.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#14171A">GL2601010001<tspan fill="#E4392F">87</tspan></text>

          <circle cx="200" cy="77" r="24" fill="#E4392F"/>
          <path d="M188 70 H212 M188 84 H212" stroke="#FDFDFB" stroke-width="4" stroke-linecap="round"/>
          <path d="M186 92 L214 62" stroke="#FDFDFB" stroke-width="4" stroke-linecap="round"/>

          <path d="M200 132 L200 154 M192 146 L200 154 L208 146" stroke="#FFC400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- actions -->
          <g>
            <rect x="30" y="168" width="340" height="42" rx="8" fill="#1F2429" stroke="#3D454D" stroke-width="1.5"/>
            <circle cx="56" cy="189" r="11" fill="#E4392F"/>
            <text x="56" y="193.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#FDFDFB">1</text>
            <text x="78" y="194" font-family="ui-monospace,monospace" font-size="13.5" fill="#FDFDFB">붙이지 않는다</text>

            <rect x="30" y="220" width="340" height="42" rx="8" fill="#1F2429" stroke="#3D454D" stroke-width="1.5"/>
            <circle cx="56" cy="241" r="11" fill="#FFC400"/>
            <text x="56" y="245.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#14171A">2</text>
            <text x="78" y="246" font-family="ui-monospace,monospace" font-size="13.5" fill="#FDFDFB">바코드를 다시 스캔한다</text>

            <rect x="30" y="272" width="340" height="42" rx="8" fill="#1F2429" stroke="#3D454D" stroke-width="1.5"/>
            <circle cx="56" cy="293" r="11" fill="#8D959E"/>
            <text x="56" y="297.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#14171A">3</text>
            <text x="78" y="298" font-family="ui-monospace,monospace" font-size="13.5" fill="#FDFDFB">그래도 다르면 담당자에게 확인</text>
          </g>
        </svg>
      </div>

    </div>

    <div class="cap">
      <h2 id="capTitle">바코드를 스캔한다</h2>
      <p id="capText">화물 위 용지의 <em>상단 바코드</em> 또는 <em>오른쪽 긴 바코드</em>를 스캐너로 읽는다. 둘 중 하나만 읽으면 된다.</p>
    </div>

    <div class="track"><div id="fill"></div></div>

    <div class="ctrl">
      <button id="prev" aria-label="이전 단계">◀</button>
      <button id="play">▮▮ 정지</button>
      <button id="next" aria-label="다음 단계">▶</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

</div>

<script>
(function(){
  /* ── 바코드 그리기 (결정적 난수) ── */
  function lcg(seed){ let s=seed*9301+49297; return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
  document.querySelectorAll('[data-bar]').forEach(function(g){
    var d=g.dataset, x=+d.x, y=+d.y, w=+d.w, h=+d.h, vert=d.dir==='v', rnd=lcg(+d.seed||1);
    var span = vert ? h : w, pos = 0, out='';
    while(pos < span-2){
      var bw = 1 + Math.floor(rnd()*3.4);
      if(pos+bw > span) break;
      if(rnd() > 0.34){
        out += vert
          ? '<rect x="'+x+'" y="'+(y+pos)+'" width="'+w+'" height="'+bw+'"/>'
          : '<rect x="'+(x+pos)+'" y="'+y+'" width="'+bw+'" height="'+h+'"/>';
      }
      pos += bw + 1 + Math.floor(rnd()*2.2);
    }
    g.innerHTML = out;
  });

  /* ── 스텝 데이터 ── */
  var STEPS=[
    {k:'01',t:'바코드를 스캔한다', p:'화물 위 용지의 <em>상단 바코드</em> 또는 <em>오른쪽 긴 바코드</em>를 스캐너로 읽는다. 둘 중 하나만 읽으면 된다.', d:6000},
    {k:'02',t:'라벨이 출력된다', p:'스캔하면 프린터에서 라벨이 나온다. 라벨 <em>맨 아래</em>에 GL로 시작하는 번호가 찍혀 있다.', d:5500},
    {k:'03',t:'GL번호를 맞춰본다', p:'라벨 하단의 GL번호와 화물 용지의 GL번호가 <em>완전히 같은지</em> 확인한다. 같을 때만 다음으로 넘어간다.', d:6500},
    {k:'04',t:'GL번호를 가리지 않게 붙인다', p:'화물 용지의 <em>GL번호와 바코드를 덮지 않는 자리</em>에 붙인다. 나중에 물건이 바뀌었는지 대조해야 하는 번호다.', d:7000},
    {k:'A', t:'경고음 + 빨간 글씨가 뜨면', p:'스캔했는데 컴퓨터에서 소리가 나고 화면에 빨간 글씨가 뜨면, 라벨을 붙이지 말고 <em>화물을 바닥에 내려놓는다</em>.', d:6500},
    {k:'B', t:'GL번호가 다르면', p:'붙이지 말고 다시 스캔한다. 그래도 다르면 <em>담당자에게 확인</em>한다.', d:6000}
  ];

  var scenes=[].slice.call(document.querySelectorAll('.scene')),
      fill=document.getElementById('fill'),
      capT=document.getElementById('capTitle'),
      capP=document.getElementById('capText'),
      playBtn=document.getElementById('play'),
      dotsBox=document.getElementById('dots'),
      i=0, playing=true;

  STEPS.forEach(function(s,n){
    var b=document.createElement('button');
    b.className='dot'; b.textContent=s.k;
    if(s.k==='A'||s.k==='B') b.style.color='#E4392F';
    b.setAttribute('aria-label',s.k+': '+s.t);
    b.onclick=function(){ go(n,true); };
    dotsBox.appendChild(b);
  });
  var dots=[].slice.call(dotsBox.children);

  function timer(){
    fill.style.animation='none';
    void fill.offsetWidth;
    if(playing) fill.style.animation='run '+STEPS[i].d+'ms linear forwards';
  }
  fill.addEventListener('animationend', function(){ if(playing) go((i+1)%STEPS.length); });

  function go(n, stop){
    i=n;
    scenes.forEach(function(s,k){ s.classList.toggle('on', k===n); });
    dots.forEach(function(d,k){ d.setAttribute('aria-current', k===n?'true':'false'); });
    capT.textContent=STEPS[n].t;
    capP.innerHTML=STEPS[n].p;
    if(stop) setPlaying(false);
    timer();
  }
  function setPlaying(v){
    playing=v;
    playBtn.textContent = v ? '▮▮ 정지' : '▶ 재생';
    if(v) timer(); else fill.style.animationPlayState='paused';
  }
  playBtn.onclick=function(){ setPlaying(!playing); };
  document.getElementById('next').onclick=function(){ go((i+1)%STEPS.length,true); };
  document.getElementById('prev').onclick=function(){ go((i-1+STEPS.length)%STEPS.length,true); };
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight') go((i+1)%STEPS.length,true);
    if(e.key==='ArrowLeft') go((i-1+STEPS.length)%STEPS.length,true);
    if(e.key===' '){ e.preventDefault(); setPlaying(!playing); }
  });

  go(0);
  setPlaying(true);
})();
</script>
<style>
  @keyframes sweep{
    0%{transform:translateX(0)}
    45%{transform:translateX(112px)}
    50%{transform:translateX(112px)}
    95%{transform:translateX(0)}
    100%{transform:translateX(0)}
  }
  .scene.on [data-anim="sweep"]{animation:sweep 2.6s ease-in-out infinite}
  @keyframes rise{
    0%{transform:translateY(56px);opacity:.2}
    35%{transform:translateY(0);opacity:1}
    100%{transform:translateY(0);opacity:1}
  }
  .scene.on [data-anim="rise"]{animation:rise 2.2s cubic-bezier(.2,.8,.3,1) both}
  @keyframes ping{0%,100%{opacity:.2}50%{opacity:1}}
  .scene.on [data-anim="ping"]{animation:ping 1s ease-in-out infinite}
  @keyframes drop{0%{transform:translateY(-30px);opacity:.3}55%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
  .scene.on [data-anim="drop"]{animation:drop 1.6s cubic-bezier(.3,.9,.3,1) both}
</style>
</body>
</html>
